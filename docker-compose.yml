version: "3"

services:
  nginx:
    image: nginx:latest
    volumes:
      - ./:/var/www/
      - ./_docker/nginx/conf.d/:/etc/nginx/conf.d/
    ports:
      - "8877:80"
    depends_on:
      - app
    container_name: project_vito

  app:
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
    volumes:
      - ./:/var/www
    ports:
      - "8080:8080" # Изменено с 8081 на 8080, чтобы совпадало с запросом фронтенда
    depends_on:
      - db
    container_name: project_vit

  db:
    image: mysql:8.0
    restart: always
    volumes:
      - ./tmp/db:/var/lib/mysql
    environment:
      MYSQL_DATABASE: vito.loc
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8102:3306"
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
    container_name: vito_db
