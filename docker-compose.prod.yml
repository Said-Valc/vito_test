version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: vito_nginx
    ports:
      - "80:80"
    volumes:
      - ./_docker/nginx/conf.d/:/etc/nginx/conf.d/
      - ./:/var/www # НУЖНО для nginx (он читает файлы)
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
    container_name: vito_app
    volumes:
      - ./:/var/www # ⚠️ можно убрать позже (ниже объясню)
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: vito_db
    restart: always
    environment:
      MYSQL_DATABASE: vito
      MYSQL_ROOT_PASSWORD: strongpass11ExjpVb1
      MYSQL_USER: vito_user # 👈 ДОБАВЬТЕ
      MYSQL_PASSWORD: strongpass11ExjpVb1 # 👈 ДОБАВЬТЕ
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
